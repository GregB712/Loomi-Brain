name: security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results/${{ matrix.language }}
          upload: never
          upload-database: false
          wait-for-processing: false

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/${{ matrix.language }}
          if-no-files-found: warn
          retention-days: 14

  filesystem-scan:
    name: Trivy filesystem, secrets, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trivy vulnerability/config/secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.72.0
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-filesystem-sarif
          path: trivy-fs.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: loomi-brain-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loomi-brain-sbom
          path: loomi-brain-sbom.cdx.json
          retention-days: 14

  container-scan:
    name: Container scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build local images
        run: docker compose -f infra/docker/compose.yml build api worker web

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.72.0
          format: sarif
          output: trivy-api.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Scan worker image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-worker
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.72.0
          format: sarif
          output: trivy-worker.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Scan web image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.72.0
          format: sarif
          output: trivy-web.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload container SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-sarif
          path: |
            trivy-api.sarif
            trivy-worker.sarif
            trivy-web.sarif
          if-no-files-found: warn
          retention-days: 14
