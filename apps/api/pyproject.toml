[project]
name = "loomi-api"
version = "0.1.0"
description = "FastAPI service for Loomi-Brain."
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "defusedxml==0.7.1",
  "fastapi[standard]==0.140.7",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.14.2",
  "sqlalchemy==2.0.51",
  "structlog==26.1.0",
]

[project.optional-dependencies]
docling = [
    "docling==2.115.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "httpx2==2.9.1",
  "hypothesis==6.161.6",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["loomi_api"]
