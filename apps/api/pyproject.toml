[project]
name = "loomi-api"
version = "0.1.0"
description = "FastAPI service for Loomi-Brain."
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi[standard]==0.140.7",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "structlog==26.1.0"
]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["loomi_api"]
