[project]
name = "loomi-worker"
version = "0.1.0"
description = "Background worker for Loomi-Brain ingestion and agent jobs."
requires-python = ">=3.13,<3.15"
dependencies = [
  "dramatiq[redis,watch]==2.2.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "structlog==26.1.0"
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.15.22"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["loomi_worker"]
