services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: loomi_brain
      POSTGRES_USER: loomi
      POSTGRES_PASSWORD: loomi_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomi -d loomi_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - loomi-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loomi-postgres:
