services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: loomi_brain
      POSTGRES_USER: loomi
      POSTGRES_PASSWORD: loomi_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomi -d loomi_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - loomi-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      LOOMI_ENVIRONMENT: local
      LOOMI_DATABASE_URL: postgresql+asyncpg://loomi:loomi_dev_password@postgres:5432/loomi_brain
      LOOMI_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOOMI_OWNER_EMAIL: owner@loomi.local
      LOOMI_OWNER_PASSWORD: loomi-local-owner-password
      LOOMI_STORAGE_ROOT: /app/apps/api/var/private-objects
      LOOMI_SCANNER_MODE: fake-clean
      LOOMI_SCANNER_REQUIRED: "false"
    command:
      - sh
      - -c
      - >
        uv run --frozen --no-dev alembic upgrade head &&
        uv run --frozen --no-dev python -m loomi_api.seed &&
        uv run --frozen --no-dev fastapi run src/loomi_api/main.py --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - loomi-api-objects:/app/apps/api/var/private-objects

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      LOOMI_ENVIRONMENT: local
      LOOMI_DATABASE_URL: postgresql+asyncpg://loomi:loomi_dev_password@postgres:5432/loomi_brain
      LOOMI_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  object-store:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: loomi
      MINIO_ROOT_PASSWORD: loomi_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - loomi-object-store:/data

  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    ports:
      - "127.0.0.1:3310:3310"

  observability:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  loomi-postgres:
  loomi-object-store:
  loomi-api-objects:
